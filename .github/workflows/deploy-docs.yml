name: Deploy Docs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Generate docs
        run: docker compose run --rm crystal docs
      - name: Publish the docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
