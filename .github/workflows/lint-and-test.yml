name: Lint and Test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Run linter
        run: docker compose run --rm crystal tool format --check
      - name: Run tests
        run: docker compose run --rm -e EVENT_WINDER_RUNTIME_ERRORS=true crystal spec
